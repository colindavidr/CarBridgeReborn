name: Build CarBridgeReborn
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos (Linux toolchain + SDKs)
        uses: Randomblock1/theos-action@v1

      - name: Build rootless package
        run: |
          make clean
          make THEOS_PACKAGE_SCHEME=rootless package FINALPACKAGE=1
          echo "--- packages ---"; ls -la packages/

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: CarBridgeReborn-deb
          path: packages/*.deb
          if-no-files-found: error
